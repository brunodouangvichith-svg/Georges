[project]
name = "george"
version = "0.1.0"
description = "George — agent d'analyse technique des marchés financiers."
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "yfinance>=0.2",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "joblib>=1.3",
  "pyarrow>=15.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "mistralai>=1.5",
  "pgvector>=0.3",
  "requests>=2.31",
  "httpx>=0.27",
  "mplfinance>=0.12.10b0",  # mplfinance n'a jamais publié de release stable >=0.12 sur PyPI (que des alpha/beta) -- ">=0.12" seul échoue la résolution pip sur un environnement vierge (confirmé en direct : échec de build Render), qui exclut les pre-releases par défaut. Une borne basse contenant explicitement un identifiant de pre-release les autorise pour cette dépendance.
  "six",  # dépendance runtime non déclarée de mplfinance (bug d'empaquetage amont, confirmé en isolant un venv vierge : `pip install mplfinance` n'installe pas six, mais mplfinance/_utils.py fait `from six.moves import zip` à l'import) -- sans cette ligne, le déploiement Render casse dès le premier import de engine/chart_image.py (ModuleNotFoundError: No module named 'six'), observé en prod le 2026-11-04 (george-api est resté sur son dernier build réussi entre-temps, jamais indisponible, mais tout nouveau déploiement backend échouait).
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "testcontainers[postgres]>=4",
]
notebook = [
  "jupyter>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "engine*", "agents*", "api*", "notifications*"]

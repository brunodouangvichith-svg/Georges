[alembic]
script_location = ingestion/migrations
prepend_sys_path = .

# L'URL réelle est injectée par ingestion/migrations/env.py depuis
# la variable d'environnement DATABASE_URL (voir ingestion/db.py).
sqlalchemy.url = postgresql+psycopg://george:george@localhost:5432/george

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

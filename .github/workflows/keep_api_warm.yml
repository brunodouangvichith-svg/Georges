name: Maintien en éveil de george-api (anti cold-start Render)

# Render (plan gratuit, voir CLAUDE.md section Hosting) met le service en
# veille après 15 min sans requête entrante, et peut ensuite mettre jusqu'à
# 1-2 minutes à répondre au premier appel suivant — confirmé en direct
# (~84s observés, "graphique de prix vide sur tous les titres" alors que les
# données existaient bien, voir CLAUDE.md pour l'investigation complète).
# Un simple ping régulier sur /health (endpoint public, sans DB ni auth)
# empêche le service de jamais atteindre ce seuil d'inactivité. Cadence à
# 10 min plutôt que les 14 min théoriquement suffisants : GitHub Actions ne
# garantit pas l'heure exacte d'un déclenchement programmé (retards
# documentés sous charge), une marge de 5 min absorbe ça.
#
# DÉSACTIVÉ EN AUTOMATIQUE (octobre 2026) : ce ping toutes les 10 min, soit
# ~4 300 exécutions/mois facturées au moins 1 min chacune, dépassait à lui
# seul les 2 000 min gratuites de GitHub Actions d'un compte Free sur dépôt
# privé — résultat réel : quota épuisé, TOUS les workflows du dépôt (collectes
# quotidiennes, veille, tests de PR) bloqués avec "spending limit needs to be
# increased". Le ping est désormais fait par un service externe gratuit
# (cron-job.org, même solution que le projet Jaz/MeteoIA) qui appelle
# https://george-api-mmut.onrender.com/health toutes les 10 min sans consommer
# de minutes GitHub. Ce workflow reste lançable à la main (onglet Actions →
# "Run workflow") en dépannage si le service externe tombe.
on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # --max-time 30 (essayé en premier) a échoué sur ce tout premier run :
      # exit 28 (timeout), preuve concrète qu'un cold start réel dépasse
      # 30s -- exactement ce que ce ping doit prévenir à l'avenir, mais le
      # tout premier appel après une longue pause peut encore le rencontrer.
      # 120s absorbe ce cas sans faire échouer le job pour autant.
      - name: Ping /health
        run: curl -sf --max-time 120 https://george-api-mmut.onrender.com/health

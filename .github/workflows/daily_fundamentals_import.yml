name: Import quotidien fondamentaux (yfinance)

# Aucun scheduler n'existe dans le projet (Celery/Redis/Airflow explicitement
# reportés à la Phase 7 ; le plan gratuit Render n'offre pas de vrai Cron
# Job). GitHub Actions tourne directement les scripts d'ingestion existants
# contre la base Supabase (DATABASE_URL en secret du dépôt), gratuit à ce
# volume (quelques minutes/jour).
#
# Renommé depuis "daily_yfinance_import.yml" (Import quotidien yfinance +
# détection + propositions) : ce workflow ne fait plus que les fondamentaux/
# dividendes désormais. `ingestion.ohlcv` (prices_ohlcv, 2 ans) a été retiré
# -- plus aucun code ne lit cette table depuis le passage de la détection à
# `price_history_long` (10 ans, voir CLAUDE.md section "Long-term price
# history"). `engine.run_detection`/`engine.propose_decisions` ont été
# déplacés dans `price_history_and_detection.yml`, juste après le
# rafraîchissement hebdomadaire de `price_history_long` -- demandé
# directement par l'utilisateur pour éviter que la détection tourne
# quotidiennement contre des prix inchangés 6 jours sur 7 (ce qui aurait
# réinséré les mêmes figures en double dans `patterns_detected`, qui n'a pas
# de contrainte d'unicité).
#
# 20h UTC = 22h heure française en été (CEST, UTC+2, en vigueur actuellement).
# GitHub Actions ne gère pas nativement les fuseaux horaires/l'heure d'été :
# en hiver (CET, UTC+1), ceci s'exécutera à 21h française plutôt que 22h — un
# décalage d'1h assumé plutôt que d'ajouter une 2e règle cron pour l'hiver.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Fondamentaux + dividendes (ingestion.fundamentals)
        run: python -m ingestion.fundamentals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

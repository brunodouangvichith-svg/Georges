name: DEBUG - price_history_long row count

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Compter les lignes de price_history_long
        run: |
          python -c "
          from sqlalchemy import select, func
          from ingestion.db import get_engine
          from ingestion.models import PriceHistoryLong, Security

          engine = get_engine()
          with engine.begin() as conn:
              total = conn.execute(select(func.count()).select_from(PriceHistoryLong)).scalar()
              distinct_symbols = conn.execute(select(func.count(func.distinct(PriceHistoryLong.symbol)))).scalar()
              etl_count = conn.execute(select(func.count()).select_from(PriceHistoryLong).where(PriceHistoryLong.symbol == 'ETL.PA')).scalar()
              etl_latest = conn.execute(select(func.max(PriceHistoryLong.ts)).where(PriceHistoryLong.symbol == 'ETL.PA')).scalar()
              nb_securities = conn.execute(select(func.count()).select_from(Security)).scalar()
          print(f'TOTAL price_history_long rows: {total}')
          print(f'Distinct symbols in price_history_long: {distinct_symbols}')
          print(f'ETL.PA rows: {etl_count}, latest ts: {etl_latest}')
          print(f'Total securities tracked: {nb_securities}')
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

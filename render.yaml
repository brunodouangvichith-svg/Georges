services:
  # API FastAPI (api/main.py). Pas de service base de données ici : la base
  # Postgres de George vit sur Supabase (projet george-auth, déjà créé pour
  # l'authentification, réutilisé comme vraie base applicative — voir
  # CLAUDE.md). TimescaleDB a été abandonné (l'extension n'est plus
  # disponible sur les projets Supabase en Postgres 17, vérifié en direct) :
  # Postgres classique désormais, ce qui permet un plan Render **gratuit**
  # pour ce service web (plus besoin de disque persistant payant, la donnée
  # est chez Supabase).
  - type: web
    name: george-api
    env: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Chaîne de connexion Postgres du projet Supabase george-auth
      # (Project Settings → Database → Connection string, mode "Session"
      # ou "Transaction pooler" — jamais le mot de passe du compte
      # utilisateur Supabase lui-même, celui de la base Postgres).
      - key: DATABASE_URL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      # Repli de `agents/mistral_client.py` quand Mistral échoue après ses
      # propres retries (rate limit, quota épuisé) — optionnel : en son
      # absence, l'erreur Mistral d'origine remonte simplement, comme avant
      # cet ajout (voir la docstring du module).
      - key: DEEPSEEK_API_KEY
        sync: false
      # Recherche web pour Ask Jane (agents/web_search.py, Tavily) quand sa
      # base de connaissances indexée ne couvre pas la question — optionnel,
      # comme DEEPSEEK_API_KEY ci-dessus : en son absence, la recherche web
      # est simplement ignorée.
      - key: TAVILY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Partage par email (POST /share/email, notifications/email_client.py) —
      # compte Resend (resend.com), sandbox par défaut : sans domaine
      # vérifié, ne peut envoyer qu'à l'adresse email du compte Resend
      # lui-même (voir CLAUDE.md, section "Share by email").
      - key: RESEND_API_KEY
        sync: false

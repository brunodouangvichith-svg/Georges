# Worker Cloudflare (Cron Triggers, gratuit) qui remplace les `schedule:`
# désactivés dans ../.github/workflows/*.yml -- voir CLAUDE.md, section
# "Cron Cloudflare (remplace les workflows GitHub Actions planifiés)" et
# README.md dans ce dossier pour les étapes de déploiement.

name = "george-cron"
main = "src/index.js"
compatibility_date = "2026-01-01"

# UN SEUL Cron Trigger, pas un par job -- trouvé en déploiement réel (pas
# en revue statique) : Cloudflare limite les Cron Triggers à 5 **par
# compte** sur le plan Workers Free (pas par Worker -- confirmé sur
# developers.cloudflare.com/workers/platform/limits), et ce compte a déjà
# d'autres Workers. Les 8 crons déclarés ici au départ (un par job) ont
# échoué au déploiement (`wrangler deploy` : "invalid cron string" sur le
# 8e, message trompeur -- la vraie cause est le quota de 5/compte dépassé,
# pas une syntaxe invalide). Un seul trigger, déclenché toutes les 30 min,
# et c'est le code (`src/index.js:JOBS`, avec heure/minute/jour de semaine)
# qui décide quel(s) job(s) appeler à ce tick -- scalable à n'importe quel
# nombre de jobs sans jamais retoucher ce fichier.
#
# Espacement d'au moins 30 min entre deux jobs maintenu malgré ce
# changement (toujours nécessaire, voir src/index.js) : `fundamentals`
# (quotidien 20h, ~160 appels yfinance) tombait à l'origine exactement à la
# même minute que `confidence-model-training`/`price-history-and-detection`/
# `jane-veille-web`, tous gourmands -- deux jobs lourds en concurrence sur
# le même process Render gratuit (qui sert aussi le trafic web/mobile en
# direct) auraient pu le faire ramer pendant la fenêtre -- trouvé par
# /code-review avant même ce problème de quota.
[triggers]
crons = ["0,30 * * * *"]

# URL publique de l'API -- pas un secret, peut rester en clair ici.
# CRON_SECRET, lui, ne va JAMAIS dans ce fichier : voir README.md
# ("wrangler secret put CRON_SECRET").
[vars]
API_BASE_URL = "https://george-api-mmut.onrender.com"
